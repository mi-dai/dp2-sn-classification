# Default configuration for hyrax_parsnip. Hyrax merges this file automatically
# whenever the runtime config references a `hyrax_parsnip.*` class.

[model.HyraxParsnip]
# Pretrained ParSNIP model to start from: a built-in name ("plasticc",
# "plasticc_photoz", "ps1"), a path to a ParSNIP .pt file, or false to build a
# fresh (untrained) model from `settings` below.
pretrained = "plasticc"

# PyTorch device ParSNIP runs on ("cpu", "cuda", ...). Hyrax picks its own device
# (MPS on Apple silicon), which ParSNIP is not tested on, so by default the wrapper
# keeps ParSNIP on the CPU. Use "hyrax" to follow Hyrax's device choice.
device = "cpu"

# Number of torch threads ParSNIP sets at construction.
threads = 1

# Host-galaxy photo-z given to models that predict redshift (e.g. "plasticc_photoz")
# for every object. They were trained with a per-object host photo-z as an encoder
# input; with no host information, a large photoz_error acts as a weak prior and
# the redshift comes from the light curve itself.
photoz = 0.5
photoz_error = 1.0
# Objects with a per-object photo-z (dataset `photoz_column`, e.g. the true redshift of a
# simulation, to test the photo-z estimate) get it instead, with error
# photoz_fractional_error * (1 + photoz).
photoz_fractional_error = 0.05

# Apply ParSNIP's light-curve augmentation (drop points, time shift, noise,
# amplitude scaling) in train_batch.
augment_train = true

# ParSNIP settings overrides used only when `pretrained = false`. Any key from
# parsnip/settings.py is valid, e.g. latent_size, learning_rate, batch_size.
[model.HyraxParsnip.settings]

[data_set.ParsnipHATSDataset]
# Top-level (per-object) columns in the HATS catalog.
id_column = "object_id"
redshift_column = "redshift"
# Milky Way E(B-V) column, or false to assume no MW extinction correction.
mwebv_column = false

# Per-object host photo-z for models that predict redshift (see
# [model.HyraxParsnip] photoz_fractional_error); false: the constant prior for every object.
photoz_column = false
# Class label column, or false if the catalog is unlabeled.
label_column = false
# For training (field `label_index`): how labels map to classes ("ia": SNIa vs non-SNIa,
# "dp2": SNIa/SNII/SNIbc/other, "all": the labels as they are), and the class order
# (empty = the scheme's default order).
label_scheme = "all"
label_classes = []

# Nested light-curve column and its sub-columns.
lightcurve_column = "lightcurve"
time_column = "mjd"
flux_column = "flux"
fluxerr_column = "fluxerr"
band_column = "band"

# Multiplies flux and fluxerr to put them on the zeropoint the model was trained
# with (27.5 AB for the built-in PLAsTiCC models). For Rubin fluxes in nJy
# (zeropoint 31.4 AB) use 10**(-0.4 * (31.4 - 27.5)) = 0.027542287.
flux_scale = 1.0

# Nested boolean sub-columns (e.g. Rubin "psfDiffFlux_flag", "pixelFlags_saturated").
# Observations with any of them set are dropped.
flag_columns = []

# Drop objects with fewer usable observations than this.
min_observations = 3

# Drop objects without a finite redshift. ParSNIP models that don't predict
# redshift (e.g. "plasticc", "ps1") require one. `configure` sets this to false for
# models that predict redshift (e.g. "plasticc_photoz").
require_redshift = true

# Catalog band name -> sncosmo band name understood by the ParSNIP model.
# The order here defines the band indices passed between dataset and model, so
# this must be set globally (not per data_request via dataset_config).
[data_set.ParsnipHATSDataset.band_map]
u = "lsstu"
g = "lsstg"
r = "lsstr"
i = "lssti"
z = "lsstz"
y = "lssty"

# Extra keyword arguments for lsdb.open_catalog (e.g. search_filter).
[data_set.ParsnipHATSDataset.open_catalog_kwargs]
