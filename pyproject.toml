[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dp2-sn-classification"
version = "0.1.0"
description = "Classify Rubin DP2 transients with ParSNIP and SuperNNova through Hyrax on HATS light-curve catalogs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hyrax>=0.12",
    "astro-parsnip>=1.4",
    "lcdata",
    "lsdb",
    "nested-pandas",
    "torch",
    "lightgbm",
    "numpy",
    "astropy",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["jupyter", "ipykernel", "matplotlib"]
# Simulations in examples/demo_workflow.ipynb and simulate_dp2.py (all in desc-td-env at NERSC).
sim = ["lightcurvelynx", "sncosmo", "dustmaps", "mocpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyrax_lightcurves = ["*.toml"]
hyrax_parsnip = ["*.toml"]
hyrax_snn = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
